<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Shreenath's Tic Tac Toe Game</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <h1>Shreenath's Tic Tac Toe Game</h1>
    <p>Play & Have Fun!</p>
  </header>

  <main>
    <h2>Play Tic Tac Toe</h2>
    <div class="game-container">
      <h3>Tic Tac Toe</h3>
      <p id="status">Player X's turn</p>
      <div class="board" id="board">
        <!-- 9 cells -->
        <div class="cell" data-index="0"></div>
        <div class="cell" data-index="1"></div>
        <div class="cell" data-index="2"></div>
        <div class="cell" data-index="3"></div>
        <div class="cell" data-index="4"></div>
        <div class="cell" data-index="5"></div>
        <div class="cell" data-index="6"></div>
        <div class="cell" data-index="7"></div>
        <div class="cell" data-index="8"></div>
      </div>
      <button onclick="restartGame()">Restart Game</button>
      <p>Show off your strategic skills while browsing my resume!</p>
    </div>
  </main>

  <footer>
    <p>&copy; 2025 Shreenath | All Rights Reserved</p>
    <div class="links">
      <a href="#">LinkedIn</a>
      <a href="https://github.com/hreenath">GitHub</a>
      <a href="shreenathnaika4545@gmail.com">Contact</a>
    </div>
  </footer>

  <script src="script.js"></script>
</body>
</html>
